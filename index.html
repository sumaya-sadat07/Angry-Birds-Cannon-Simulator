<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Birds Kids Cannon Game 🎯</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Fredoka', cursive, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #74b9ff 0%, #0984e3 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      margin: 10px 0;
      color: #ffeaa7;
      text-shadow: 3px 3px 0px #d63031, 5px 5px 0px #000;
      font-size: 2.2rem;
      text-align: center;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: #6c5ce7;
      padding: 12px 20px;
      border-radius: 15px;
      border: 3px solid #fff;
      box-shadow: 0 8px 0 rgba(0,0,0,0.2);
      margin-bottom: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffeaa7;
    }

    canvas {
      background: linear-gradient(180deg, #81ecec 0%, #74b9ff 70%, #55efc4 70%, #00b894 100%);
      border-radius: 20px;
      border: 5px solid #fff;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      width: 100%;
      height: auto;
      max-width: 850px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      width: 100%;
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      padding: 15px;
      border-radius: 20px;
      border: 2px solid #fff;
    }

    .control-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 180px;
    }

    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #ffeaa7;
      text-shadow: 1px 1px 2px #000;
    }

    input[type="range"] {
      width: 100%;
      height: 12px;
      border-radius: 6px;
      outline: none;
      background: #ffeaa7;
      cursor: pointer;
    }

    .btn {
      padding: 12px 25px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    #launchBtn { background: #ff7675; box-shadow: 0 6px 0 #d63031; }
    #resetBtn { background: #00cec9; box-shadow: 0 6px 0 #00b894; }

    .telemetry {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-top: 15px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 12px;
      font-size: 0.9rem;
    }

    .telemetry div {
      text-align: center;
    }

    .telemetry span {
      color: #fdcb6e;
      font-weight: bold;
      font-size: 1.1rem;
      display: block;
    }
  </style>
</head>
<body>

  <h1>🎯 Angry Birds Kids Target Shooter 🚀</h1>

  <div class="game-container">
    <div class="top-bar">
      <div>⭐ Score: <span id="score">0</span></div>
      <div>🎯 Target: <span id="targetDist">500</span>m</div>
    </div>

    <canvas id="gameCanvas" width="850" height="420"></canvas>

    <div class="controls">
      <div class="control-box">
        <label>🚀 Speed: <span id="vVal">120</span> m/s</label>
        <input type="range" id="velocity" min="20" max="200" value="120">
      </div>
      <div class="control-box">
        <label>📐 Angle: <span id="aVal">45</span>°</label>
        <input type="range" id="angle" min="10" max="85" value="45">
      </div>
      <div class="control-box">
        <label>🌍 Gravity: <span id="gVal">9.8</span> m/s²</label>
        <input type="range" id="gravity" min="1" max="20" step="0.1" value="9.8">
      </div>

      <button class="btn" id="launchBtn">🔥 LAUNCH!</button>
      <button class="btn" id="resetBtn">🎲 NEW TARGET</button>
    </div>

    <div class="telemetry">
      <div>Flight Time<span id="tDisplay">0.00 s</span></div>
      <div>Max Height<span id="hDisplay">0.00 m</span></div>
      <div>Distance<span id="dDisplay">0.00 m</span></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const vInput = document.getElementById('velocity');
    const aInput = document.getElementById('angle');
    const gInput = document.getElementById('gravity');

    const vVal = document.getElementById('vVal');
    const aVal = document.getElementById('aVal');
    const gVal = document.getElementById('gVal');

    const tDisplay = document.getElementById('tDisplay');
    const hDisplay = document.getElementById('hDisplay');
    const dDisplay = document.getElementById('dDisplay');
    const scoreDisplay = document.getElementById('score');
    const targetDistDisplay = document.getElementById('targetDist');

    let score = 0;
    let targetDist = 450;
    let isHit = false;
    let animationId = null;

    // Web Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'launch') {
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      }
    }

    function updateInputs() {
      vVal.textContent = vInput.value;
      aVal.textContent = aInput.value;
      gVal.textContent = gInput.value;
    }

    [vInput, aInput, gInput].forEach(inp => inp.addEventListener('input', updateInputs));

    function setRandomTarget() {
      targetDist = Math.floor(Math.random() * 550) + 150;
      targetDistDisplay.textContent = targetDist;
      isHit = false;
    }

    function drawScene(progress = 1) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const u = parseFloat(vInput.value);
      const angle = parseFloat(aInput.value);
      const g = parseFloat(gInput.value);

      const rad = (angle * Math.PI) / 180;
      const totalTime = (2 * u * Math.sin(rad)) / g;
      const maxHeight = (u * u * Math.sin(rad) * Math.sin(rad)) / (2 * g);
      const totalDist = (u * u * Math.sin(2 * rad)) / g;

      tDisplay.textContent = totalTime.toFixed(2) + ' s';
      hDisplay.textContent = maxHeight.toFixed(2) + ' m';
      dDisplay.textContent = totalDist.toFixed(2) + ' m';

      const startX = 60;
      const startY = canvas.height - 50;

      const scaleX = (canvas.width - 120) / Math.max(totalDist, targetDist + 80);
      const scaleY = (canvas.height - 120) / Math.max(maxHeight, 40);
      const scale = Math.min(scaleX, scaleY);

      // Clouds
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
      ctx.beginPath();
      ctx.arc(120, 60, 20, 0, Math.PI * 2);
      ctx.arc(140, 50, 28, 0, Math.PI * 2);
      ctx.arc(160, 60, 20, 0, Math.PI * 2);
      ctx.fill();

      // Target Pig
      const pigX = startX + targetDist * scale;
      const pigY = startY - 15;

      ctx.beginPath();
      ctx.arc(pigX, pigY, 16, 0, Math.PI * 2);
      ctx.fillStyle = isHit ? "#fdcb6e" : "#55efc4";
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#2d3436";
      ctx.stroke();

      // Pig Nose & Eyes
      ctx.fillStyle = "#2d3436";
      ctx.beginPath();
      ctx.arc(pigX - 5, pigY - 4, 2, 0, Math.PI * 2);
      ctx.arc(pigX + 5, pigY - 4, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(pigX, pigY + 2, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#00b894";
      ctx.fill();

      // Trajectory Line
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      const vx = u * Math.cos(rad);
      const vy = u * Math.sin(rad);

      const currentTime = totalTime * progress;

      for (let t = 0; t <= currentTime; t += 0.02) {
        let x = vx * t;
        let y = vy * t - 0.5 * g * t * t;
        ctx.lineTo(startX + x * scale, startY - y * scale);
      }

      ctx.strokeStyle = "#d63031";
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Bird
      if (progress > 0) {
        let t = currentTime;
        let x = vx * t;
        let y = vy * t - 0.5 * g * t * t;

        let bX = startX + x * scale;
        let bY = startY - y * scale;

        ctx.beginPath();
        ctx.arc(bX, bY, 12, 0, Math.PI * 2);
        ctx.fillStyle = "#ff7675";
        ctx.fill();
        ctx.stroke();

        // Eye & Beak
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(bX + 4, bY - 3, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.arc(bX + 5, bY - 3, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffeaa7";
        ctx.beginPath();
        ctx.moveTo(bX + 8, bY);
        ctx.lineTo(bX + 16, bY + 2);
        ctx.lineTo(bX + 8, bY + 6);
        ctx.fill();

        // Hit Detection
        if (Math.abs(x - targetDist) < 25 && y < 25 && !isHit) {
          isHit = true;
          score += 100;
          scoreDisplay.textContent = score;
          playSound('hit');
        }
      }
    }

    document.getElementById('launchBtn').addEventListener('click', () => {
      if (animationId) cancelAnimationFrame(animationId);
      playSound('launch');

      const u = parseFloat(vInput.value);
      const angle = parseFloat(aInput.value);
      const g = parseFloat(gInput.value);

      const rad = (angle * Math.PI) / 180;
      const totalTime = (2 * u * Math.sin(rad)) / g;

      let startTime = null;
      const duration = Math.min(Math.max(totalTime * 200, 1000), 3500);

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let elapsed = timestamp - startTime;
        let progress = Math.min(elapsed / duration, 1);

        drawScene(progress);

        if (progress < 1) {
          animationId = requestAnimationFrame(animate);
        }
      }

      animationId = requestAnimationFrame(animate);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      setRandomTarget();
      drawScene(1);
    });

    updateInputs();
    setRandomTarget();
    drawScene(1);
  </script>
</body>
</html>
