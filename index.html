<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Birds Cannon Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #1a1a2e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      color: #e63946;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 1200px;
      width: 100%;
    }

    .controls-panel {
      background: #16213e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      flex: 1;
      min-width: 280px;
      max-width: 350px;
    }

    .control-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #a8dede;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #0f3460;
      border-radius: 5px;
      outline: none;
    }

    .value-display {
      float: right;
      color: #e63946;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #e63946;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #c1121f;
    }

    .simulation-area {
      flex: 2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background: linear-gradient(to bottom, #1d3557, #457b9d);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      width: 100%;
      height: auto;
      max-width: 800px;
    }

    .telemetry {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
      background: #16213e;
      padding: 15px;
      border-radius: 10px;
    }

    .telemetry-card {
      text-align: center;
    }

    .telemetry-card span {
      display: block;
      font-size: 14px;
      color: #8d99ae;
    }

    .telemetry-card strong {
      font-size: 18px;
      color: #f1faee;
    }
  </style>
</head>
<body>

  <h1>Angry Birds Cannon Simulator</h1>

  <div class="container">
    <div class="controls-panel">
      <div class="control-group">
        <label>Velocity (u): <span class="value-display" id="velVal">145</span> m/s</label>
        <input type="range" id="velocity" min="1" max="200" value="145">
      </div>

      <div class="control-group">
        <label>Angle (&theta;): <span class="value-display" id="angleVal">12</span>&deg;</label>
        <input type="range" id="angle" min="1" max="89" value="12">
      </div>

      <div class="control-group">
        <label>Gravity (g): <span class="value-display" id="gravVal">5.9</span> m/s&sup2;</label>
        <input type="range" id="gravity" min="1" max="25" step="0.1" value="5.9">
      </div>

      <button id="launchBtn">LAUNCH</button>
    </div>

    <div class="simulation-area">
      <canvas id="simCanvas" width="800" height="400"></canvas>

      <div class="telemetry">
        <div class="telemetry-card">
          <span>Flight Time</span>
          <strong id="flightTime">0.00 s</strong>
        </div>
        <div class="telemetry-card">
          <span>Max Height</span>
          <strong id="maxHeight">0.00 m</strong>
        </div>
        <div class="telemetry-card">
          <span>Total Distance</span>
          <strong id="totalDistance">0.00 m</strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const velocityInput = document.getElementById('velocity');
    const angleInput = document.getElementById('angle');
    const gravityInput = document.getElementById('gravity');

    const velVal = document.getElementById('velVal');
    const angleVal = document.getElementById('angleVal');
    const gravVal = document.getElementById('gravVal');

    const timeDisplay = document.getElementById('flightTime');
    const heightDisplay = document.getElementById('maxHeight');
    const distanceDisplay = document.getElementById('totalDistance');

    const launchBtn = document.getElementById('launchBtn');

    let animationId = null;

    function updateInputValues() {
      velVal.textContent = velocityInput.value;
      angleVal.textContent = angleInput.value;
      gravVal.textContent = gravityInput.value;
    }

    velocityInput.addEventListener('input', updateInputValues);
    angleInput.addEventListener('input', updateInputValues);
    gravityInput.addEventListener('input', updateInputValues);

    function calculatePhysics(u, angleDeg, g) {
      const rad = (angleDeg * Math.PI) / 180;
      const time = (2 * u * Math.sin(rad)) / g;
      const height = (u * u * Math.sin(rad) * Math.sin(rad)) / (2 * g);
      const distance = (u * u * Math.sin(2 * rad)) / g;

      return { rad, time, height, distance };
    }

    function drawScene(u, angleDeg, g, animationProgress = 1) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const { rad, time, height, distance } = calculatePhysics(u, angleDeg, g);

      const startX = 50;
      const startY = canvas.height - 40;

      const availableWidth = canvas.width - 100;
      const availableHeight = canvas.height - 80;

      // Uniform Aspect Ratio Scaling for physically accurate representation
      const scaleX = availableWidth / Math.max(distance, 10);
      const scaleY = availableHeight / Math.max(height, 10);
      const scale = Math.min(scaleX, scaleY);

      // Draw Ground
      ctx.beginPath();
      ctx.moveTo(0, startY);
      ctx.lineTo(canvas.width, startY);
      ctx.strokeStyle = '#a8dede';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw Cannon Origin
      ctx.beginPath();
      ctx.arc(startX, startY, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#e63946';
      ctx.fill();

      // Draw Trajectory
      ctx.beginPath();
      ctx.moveTo(startX, startY);

      const vx = u * Math.cos(rad);
      const vy = u * Math.sin(rad);

      const currentMaxTime = time * animationProgress;

      for (let t = 0; t <= currentMaxTime; t += 0.02) {
        let x = vx * t;
        let y = vy * t - 0.5 * g * t * t;

        let drawX = startX + x * scale;
        let drawY = startY - y * scale;

        ctx.lineTo(drawX, drawY);
      }

      ctx.strokeStyle = '#e63946';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw Projectile
      if (animationProgress > 0) {
        let t = currentMaxTime;
        let x = vx * t;
        let y = vy * t - 0.5 * g * t * t;

        let projX = startX + x * scale;
        let projY = startY - y * scale;

        ctx.beginPath();
        ctx.arc(projX, projY, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#ffb703';
        ctx.fill();
      }

      // Telemetry UI Update
      timeDisplay.textContent = time.toFixed(2) + ' s';
      heightDisplay.textContent = height.toFixed(2) + ' m';
      distanceDisplay.textContent = distance.toFixed(2) + ' m';
    }

    launchBtn.addEventListener('click', () => {
      if (animationId) cancelAnimationFrame(animationId);

      const u = parseFloat(velocityInput.value);
      const angleDeg = parseFloat(angleInput.value);
      const g = parseFloat(gravityInput.value);

      const { time } = calculatePhysics(u, angleDeg, g);

      let startTime = null;
      const duration = Math.min(Math.max(time * 200, 1000), 4000);

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let elapsed = timestamp - startTime;
        let progress = Math.min(elapsed / duration, 1);

        drawScene(u, angleDeg, g, progress);

        if (progress < 1) {
          animationId = requestAnimationFrame(animate);
        }
      }

      animationId = requestAnimationFrame(animate);
    });

    // Initial Load
    updateInputValues();
    drawScene(
      parseFloat(velocityInput.value),
      parseFloat(angleInput.value),
      parseFloat(gravityInput.value),
      1
    );
  </script>
</body>
</html>
